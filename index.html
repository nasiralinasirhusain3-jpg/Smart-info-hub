<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fc;color:#172033;line-height:1.6}
header{padding:28px 18px 34px;color:white;background:linear-gradient(120deg,#142b63,#245bd8,#12a69c)}
.wrap{max-width:1000px;margin:auto;padding:0 16px}.logo{font-weight:bold;font-size:21px}h1{font-size:clamp(32px,6vw,52px);line-height:1.1;margin:30px 0 10px}.sub{max-width:650px;color:#e8efff}
.search{display:flex;gap:8px;max-width:600px;margin-top:20px}.search input{flex:1;min-width:0;padding:13px;border:0;border-radius:10px;font-size:16px}.search button{padding:13px 18px;border:0;border-radius:10px;background:#ffcf55;font-weight:bold}
main{padding:26px 0 45px}.notice{background:#fff8df;border:1px solid #efdfa6;border-radius:12px;padding:12px;margin-bottom:18px}
.ad{min-height:100px;border:1px dashed #9eabc1;border-radius:13px;background:white;display:grid;place-items:center;text-align:center;color:#68748a;margin:20px 0;padding:15px}
h2{margin:25px 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:white;border:1px solid #e3e9f3;border-radius:15px;padding:18px}.icon{font-size:30px}.tag{font-size:12px;color:#2457c8;font-weight:bold}.card h3{margin:6px 0}.card p{color:#66718a;margin:0}.card button{border:0;background:none;color:#2457c8;font-weight:bold;padding:12px 0 0;font-size:15px}
.article{display:none;background:white;border-radius:14px;padding:20px;margin-top:18px}.article.show{display:block}footer{border-top:1px solid #e0e6ef;padding:22px 0;color:#68748a;font-size:14px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}.search{flex-direction:column}.search button{width:100%}}
</style>
